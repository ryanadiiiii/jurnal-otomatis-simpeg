name: SIMPEG Jurnal Harian Otomatis

on:
  schedule:
    # Jalan setiap hari Senin-Jumat pada jam 01:00 UTC (08:00 WIB)
    # Format cron: menit jam tanggal bulan hari
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    # Memungkinkan kita menjalankan bot secara manual (klik tombol di GitHub)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies for OpenCV & Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Playwright Browsers
      run: playwright install chromium --with-deps

    - name: Run SIMPEG Scheduler
      env:
        SIMPEG_NIP: ${{ secrets.SIMPEG_NIP }}
        SIMPEG_PASSWORD: ${{ secrets.SIMPEG_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DRY_RUN: 'False'
      run: python scheduler.py
